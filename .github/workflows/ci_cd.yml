name: CI / CD – Segmentation API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/segmentation-api

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1 – Unit tests
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create dummy .env for tests
        run: |
          cat > .env <<EOF
          LOG_LEVEL=WARNING
          MODEL_PATH=/tmp/no_model.pth
          IMAGE_SIZE=64
          API_KEY=
          EOF

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2 – Build Docker image
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test            # only build if tests pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 3 – Push to Docker Hub  (only on push to main)
  # ────────────────────────────────────────────────────────────────────────────
  push:
    name: Push to Docker Hub
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}    # Personal Access Token stored in GitHub Secrets

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Image digest
        run: echo "Pushed ${{ env.IMAGE_NAME }}:${{ github.sha }}"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 4 – Smoke test deployed image  (bonus)
  # ────────────────────────────────────────────────────────────────────────────
  smoke:
    name: Smoke Test (Docker Compose)
    runs-on: ubuntu-latest
    needs: push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env for smoke test
        run: |
          cat > .env <<EOF
          DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_REPO=segmentation-api
          LOG_LEVEL=WARNING
          MODEL_PATH=/app/checkpoints/best_model.pth
          IMAGE_SIZE=64
          API_KEY=
          EOF

      - name: Start service
        run: |
          mkdir -p checkpoints      # empty; API runs in demo mode
          docker compose up -d --wait

      - name: Health check
        run: |
          sleep 5
          curl --fail http://localhost:5001/ | python3 -m json.tool

      - name: Tear down
        if: always()
        run: docker compose down
